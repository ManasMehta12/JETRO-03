services:
  api:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    environment:
      VIVA_DATABASE_URL: ${VIVA_DATABASE_URL:-sqlite:////data/viva.db}
      VIVA_RUN_INLINE_WORKER: "false"
    volumes:
      - viva-data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      VIVA_DATABASE_URL: ${VIVA_DATABASE_URL:-sqlite:////data/viva.db}
      VIVA_RUN_INLINE_WORKER: "false"
    volumes:
      - viva-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api/v1}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  proxy:
    image: caddy:2.10-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped
volumes:
  viva-data:
  caddy-data:
  caddy-config:
